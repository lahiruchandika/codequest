<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest — SE Interview Prep</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --border:#2a2f3a;
  --text:#e6e8ee; --muted:#9aa3b2; --accent:#7c5cff; --accent2:#22d3ee;
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --code:#0b0d12;
}
[data-theme="light"]{
  --bg:#f7f8fb; --panel:#ffffff; --panel2:#f0f2f7; --border:#dfe3eb;
  --text:#1b1f27; --muted:#5b6577; --accent:#6440ff; --accent2:#0ea5e9;
  --code:#f3f5fa;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{position:sticky;top:0;z-index:100;background:var(--panel);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.hwrap{max-width:1400px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav.topnav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
nav.topnav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
nav.topnav button:hover{color:var(--text);background:var(--panel2)}
nav.topnav button.active{color:var(--text);background:var(--panel2);border-color:var(--border)}
.toolbar{display:flex;gap:8px}
.toolbar button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px}
.layout{max-width:1400px;margin:0 auto;padding:24px;display:grid;grid-template-columns:240px 1fr;gap:24px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
aside{position:sticky;top:80px;height:fit-content;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
aside h4{margin:6px 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
aside a{display:block;padding:7px 10px;color:var(--muted);text-decoration:none;border-radius:6px;font-size:13px;border-left:2px solid transparent}
aside a:hover{color:var(--text);background:var(--panel2)}
aside a.active{color:var(--text);background:var(--panel2);border-left-color:var(--accent)}
main{min-width:0}
.page{display:none}
.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:32px;margin:0 0 6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:22px;margin:32px 0 10px;border-bottom:1px solid var(--border);padding-bottom:8px}
h3{font-size:17px;margin:20px 0 8px;color:var(--text)}
p,li{color:var(--text)}
.lead{color:var(--muted);font-size:15px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:6px;font-size:11px;margin-right:4px}
code{background:var(--code);padding:2px 6px;border-radius:4px;font-family:"SF Mono",Monaco,Consolas,monospace;font-size:13px}
pre{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:14px;overflow-x:auto;font-size:13px;line-height:1.5;position:relative}
pre code{background:transparent;padding:0}
.copy{position:absolute;top:8px;right:8px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer}
.copy:hover{color:var(--text)}
.k{color:#c792ea}.s{color:#c3e88d}.n{color:#f78c6c}.c{color:#546e7a;font-style:italic}.f{color:#82aaff}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.qa{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin:8px 0;overflow:hidden}
.qa summary{padding:12px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";color:var(--accent);font-size:20px;transition:.2s}
.qa[open] summary::after{transform:rotate(45deg)}
.qa summary:hover{background:var(--panel2)}
.qa-body{padding:0 16px 14px;color:var(--muted)}
.qa-body p{color:var(--muted)}
.viz{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:16px;margin:12px 0}
.viz-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.viz-controls input,.viz-controls button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px}
.viz-controls button{cursor:pointer;background:var(--accent);color:white;border-color:var(--accent);font-weight:600}
.viz-controls button:hover{opacity:.9}
.viz-controls button.sec{background:var(--panel2);color:var(--text);border-color:var(--border);font-weight:400}
.array-box{display:flex;gap:4px;flex-wrap:wrap;min-height:50px;align-items:center}
.cell{min-width:42px;height:42px;background:var(--panel);border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;position:relative;transition:.2s}
.cell.hi{background:var(--accent);color:white;border-color:var(--accent)}
.cell.ok{background:var(--ok);color:white;border-color:var(--ok)}
.cell .idx{position:absolute;bottom:-18px;font-size:10px;color:var(--muted);font-weight:400}
.runner{background:var(--code);border:1px solid var(--border);border-radius:8px;margin:12px 0;overflow:hidden}
.runner textarea{width:100%;min-height:140px;background:transparent;color:var(--text);border:none;padding:12px;font-family:"SF Mono",Monaco,monospace;font-size:13px;resize:vertical;outline:none}
.runner .rbar{display:flex;justify-content:space-between;padding:8px 12px;background:var(--panel2);border-top:1px solid var(--border)}
.runner button{background:var(--accent);color:white;border:none;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.runner .out{padding:10px 12px;background:#000;color:#0f0;font-family:monospace;font-size:12px;min-height:30px;white-space:pre-wrap;border-top:1px solid var(--border)}
.banner{background:linear-gradient(135deg,rgba(124,92,255,.1),rgba(34,211,238,.1));border:1px solid var(--accent);border-radius:12px;padding:20px;margin:20px 0}
.note{background:rgba(245,158,11,.08);border-left:3px solid var(--warn);padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;font-size:14px}
.tip{background:rgba(34,197,94,.08);border-left:3px solid var(--ok);padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;font-size:14px}
.warn{background:rgba(239,68,68,.08);border-left:3px solid var(--err);padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;font-size:14px}
ul,ol{padding-left:22px}
li{margin:4px 0}
.quiz{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin:12px 0}
.quiz .opts{display:grid;gap:6px;margin-top:10px}
.quiz .opt{padding:9px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:14px}
.quiz .opt:hover{border-color:var(--accent)}
.quiz .opt.correct{background:rgba(34,197,94,.15);border-color:var(--ok)}
.quiz .opt.wrong{background:rgba(239,68,68,.15);border-color:var(--err)}
.quiz .expl{margin-top:10px;padding:10px;background:var(--code);border-radius:6px;font-size:13px;color:var(--muted);display:none}
.quiz.answered .expl{display:block}
.bigo-bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.bigo-bar .lbl{width:90px;font-family:monospace}
.bigo-bar .bar{height:18px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
svg{display:block;max-width:100%}
footer{text-align:center;padding:30px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);margin-top:40px}
.kbd{background:var(--panel2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:11px;color:var(--muted)}

/* ===== Mobile / responsive ===== */
.hamburger{display:none;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1}
.hamburger:hover{background:var(--panel)}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;opacity:0;pointer-events:none;transition:opacity .2s ease}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:85vw;background:var(--panel);border-left:1px solid var(--border);z-index:200;padding:18px;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease}
.drawer.open{transform:translateX(0)}
.drawer h4{margin:0 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.drawer .closebtn{position:absolute;top:14px;right:14px;background:transparent;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0;line-height:1}
.drawer button.nav{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--muted);padding:9px 11px;border-radius:7px;cursor:pointer;font-size:14px;margin:3px 0}
.drawer button.nav.active{color:var(--text);background:var(--panel2);border-color:var(--border)}
.drawer button.nav:hover{color:var(--text);background:var(--panel2)}

@media (max-width:900px){
  .hwrap{padding:10px 14px;gap:8px;flex-wrap:nowrap}
  .logo{font-size:15px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  nav.topnav{display:none}
  .hamburger{display:block}
  .toolbar button{font-size:11px;padding:5px 8px}
  .layout{padding:14px;gap:14px;grid-template-columns:1fr}
  aside{display:none}
  main{min-width:0}
  h1{font-size:24px}
  h2{font-size:18px;margin-top:24px}
  h3{font-size:15px}
  p,li{font-size:14px}
  .lead{font-size:14px}
  .card{padding:14px}
  .grid2{grid-template-columns:1fr;gap:10px}
  .banner{padding:14px}
  table{font-size:12px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
  th,td{padding:7px 9px}
  pre{font-size:12px;padding:12px;padding-top:34px}
  pre .copy{font-size:10px;padding:2px 6px;top:6px;right:6px}
  .viz{padding:12px}
  .viz-controls{gap:5px}
  .viz-controls input{width:70px!important;font-size:12px;padding:5px 8px}
  .viz-controls button{font-size:11px;padding:5px 9px}
  .runner textarea{min-height:110px;font-size:12px}
  .runner .out{font-size:11px}
  .quiz{padding:12px}
  .quiz .opt{font-size:13px;padding:8px 10px}
  .qa summary{padding:11px 14px;font-size:14px}
  .qa-body{padding:0 14px 12px;font-size:13px}
  .qa-body p,.qa-body li{font-size:13px}
  .bigo-bar{flex-wrap:wrap}
  .bigo-bar .lbl{width:70px;font-size:12px}
  #sort-viz>div{flex:1;min-width:3px}
  footer{padding:20px 14px;font-size:12px}
  #bst-svg{height:240px}
}
@media (max-width:500px){
  .hwrap{padding:9px 12px}
  .logo{font-size:14px}
  .layout{padding:12px}
  h1{font-size:21px}
  .cell{min-width:36px;height:36px;font-size:13px}
  .drawer{width:240px;padding:14px}
  .toolbar{gap:4px}
  .toolbar button{font-size:10px;padding:4px 7px}
  .hamburger{padding:5px 10px;font-size:16px}
}

</style>

// ============ PAGE: BIG-O ============
CONTENT.bigo = `
<h1>Big-O Notation</h1>
<p class="lead">Big-O describes how an algorithm's runtime or space grows as input size grows. It's the #1 thing interviewers test.</p>

<h2>The common complexities (best → worst)</h2>
<div class="card">
  <div class="bigo-bar"><span class="lbl">O(1)</span><div class="bar" style="width:5%"></div><span>Constant — hash lookup, array index</span></div>
  <div class="bigo-bar"><span class="lbl">O(log n)</span><div class="bar" style="width:12%"></div><span>Logarithmic — binary search, balanced BST</span></div>
  <div class="bigo-bar"><span class="lbl">O(n)</span><div class="bar" style="width:25%"></div><span>Linear — single loop, linear search</span></div>
  <div class="bigo-bar"><span class="lbl">O(n log n)</span><div class="bar" style="width:40%"></div><span>Log-linear — merge sort, quicksort avg</span></div>
  <div class="bigo-bar"><span class="lbl">O(n²)</span><div class="bar" style="width:65%"></div><span>Quadratic — nested loops, bubble sort</span></div>
  <div class="bigo-bar"><span class="lbl">O(2ⁿ)</span><div class="bar" style="width:88%"></div><span>Exponential — naive recursion (fib)</span></div>
  <div class="bigo-bar"><span class="lbl">O(n!)</span><div class="bar" style="width:100%"></div><span>Factorial — permutations, brute TSP</span></div>
</div>

<h2>How to figure out Big-O</h2>
<ol>
  <li>Find the <strong>dominant term</strong>. O(n + n²) = O(n²).</li>
  <li>Drop <strong>constants</strong>. O(2n) = O(n).</li>
  <li>Different inputs = different variables. Two arrays a, b → O(a + b), not O(n).</li>
  <li>Nested loops over the <em>same</em> input → multiply. O(n) × O(n) = O(n²).</li>
</ol>

<h2>Examples</h2>
<pre><code><span class="c">// O(1) — does not depend on n</span>
<span class="k">function</span> <span class="f">first</span>(arr){ <span class="k">return</span> arr[<span class="n">0</span>]; }

<span class="c">// O(n) — touches each element once</span>
<span class="k">function</span> <span class="f">sum</span>(arr){
  <span class="k">let</span> s = <span class="n">0</span>;
  <span class="k">for</span> (<span class="k">const</span> x <span class="k">of</span> arr) s += x;
  <span class="k">return</span> s;
}

<span class="c">// O(n²) — nested loop over same input</span>
<span class="k">function</span> <span class="f">pairs</span>(arr){
  <span class="k">for</span> (<span class="k">let</span> i=<span class="n">0</span>; i&lt;arr.length; i++)
    <span class="k">for</span> (<span class="k">let</span> j=i+<span class="n">1</span>; j&lt;arr.length; j++)
      console.log(arr[i], arr[j]);
}

<span class="c">// O(log n) — halves search space each step</span>
<span class="k">function</span> <span class="f">binarySearch</span>(arr, target){
  <span class="k">let</span> lo=<span class="n">0</span>, hi=arr.length-<span class="n">1</span>;
  <span class="k">while</span> (lo &lt;= hi){
    <span class="k">const</span> mid = (lo+hi) &gt;&gt; <span class="n">1</span>;
    <span class="k">if</span> (arr[mid] === target) <span class="k">return</span> mid;
    arr[mid] &lt; target ? lo=mid+<span class="n">1</span> : hi=mid-<span class="n">1</span>;
  }
  <span class="k">return</span> -<span class="n">1</span>;
}</code></pre>

<h2>Space complexity</h2>
<p>Same idea but for memory. Recursion uses stack space — recursive fib has O(n) stack depth even though it's O(2ⁿ) time.</p>

<h2>Try it: which Big-O?</h2>
<div class="quiz" data-correct="1">
  <strong>Q: What is the time complexity?</strong>
  <pre style="margin-top:8px"><code>for (let i = 0; i &lt; n; i++)
  for (let j = 0; j &lt; n; j++)
    sum += arr[i] * arr[j];</code></pre>
  <div class="opts">
    <div class="opt">O(n)</div>
    <div class="opt">O(n²)</div>

</div>

<h2>Implementation</h2>
<pre><code>class Node {
  constructor(value){
    this.value = value;
    this.next = null;
  }
}

class LinkedList {
  constructor(){ this.head = null; this.size = 0; }

  addHead(v){
    const node = new Node(v);
    node.next = this.head;
    this.head = node;
    this.size++;
  }

  addTail(v){
    const node = new Node(v);
    if (!this.head){ this.head = node; this.size++; return; }
    let cur = this.head;
    while (cur.next) cur = cur.next;
    cur.next = node;
    this.size++;
  }

  removeHead(){
    if (!this.head) return null;
    const v = this.head.value;
    this.head = this.head.next;
    this.size--;
    return v;
  }

  find(v){
    let cur = this.head;
    while (cur){
      if (cur.value === v) return cur;
      cur = cur.next;
    }
    return null;
  }

<pre><code>function reverse(head){

    cur.next = prev;
    prev = cur;
    cur = next;
  }
  return prev;

<pre><code>function hasCycle(head){
  let slow = head, fast = head;
  while (fast &amp;&amp; fast.next){
    slow = slow.next;
    fast = fast.next.next;
    if (slow === fast) return true;
  }
  return false;
}</code></pre>

<h3>Find middle node</h3>
<pre><code>function middle(head){
  let slow = head, fast = head;
  while (fast &amp;&amp; fast.next){

    fast = fast.next.next;
  }
  return slow;
}</code></pre>

<h3>Merge two sorted lists</h3>
<pre><code>function merge(a, b){

<h2>Q&amp;A</h2>

<h1>Heaps &amp; Priority Queue</h1>
<p class="lead">A heap is a tree-based data structure where parent is always ≤ (min-heap) or ≥ (max-heap) its children. Used to implement priority queues.</p>

<h2>Properties</h2>
<ul>
  <li>Complete binary tree (filled level by level, left to right)</li>
  <li>Stored as an array — parent at <code>i</code>, children at <code>2i+1</code> and <code>2i+2</code></li>
  <li>Get min/max: O(1) — it's the root</li>
  <li>Insert: O(log n) — bubble up</li>
  <li>Extract min/max: O(log n) — sift down</li>
</ul>

<h2>When to use a heap</h2>
<ul>
  <li>Top-K problems (top 10 trending tweets)</li>
  <li>Dijkstra's shortest path</li>
  <li>Merge K sorted lists</li>
  <li>Task scheduling by priority</li>
  <li>Streaming median</li>
</ul>

<h2>Min-heap implementation</h2>
<pre><code>class MinHeap {
  constructor(){ this.h = []; }
  size(){ return this.h.length; }
  peek(){ return this.h[0]; }

  push(v){
    this.h.push(v);
    this._up(this.h.length - 1);
  }

  pop(){
    if (!this.h.length) return undefined;
    const top = this.h[0];
    const last = this.h.pop();
    if (this.h.length){ this.h[0] = last; this._down(0); }
    return top;
  }

  _up(i){
    while (i &gt; 0){
      const p = (i - 1) &gt;&gt; 1;
      if (this.h[p] &lt;= this.h[i]) break;
      [this.h[p], this.h[i]] = [this.h[i], this.h[p]];
      i = p;
    }
  }

  _down(i){
    const n = this.h.length;
    while (true){
      const l = 2*i + 1, r = 2*i + 2;
      let smallest = i;
      if (l &lt; n &amp;&amp; this.h[l] &lt; this.h[smallest]) smallest = l;
      if (r &lt; n &amp;&amp; this.h[r] &lt; this.h[smallest]) smallest = r;
      if (smallest === i) break;
      [this.h[i], this.h[smallest]] = [this.h[smallest], this.h[i]];
      i = smallest;
    }
  }
}</code></pre>

<h2>Q&amp;A</h2>
<details class="qa"><summary>Heap vs BST?</summary>
<div class="qa-body"><p>Both are O(log n) insert. Heap = O(1) peek of min/max, no ordering of other elements. BST = O(log n) for any search, supports in-order iteration. Heap is better for priority queues; BST is better for ordered range queries.</p></div></details>

<h2>Bubble Sort</h2>

    for (let j=0; j&lt;n-1-i; j++){

<h2>Insertion Sort</h2>
<pre><code>function insertionSort(arr){

    while (j &gt;= 0 &amp;&amp; arr[j] &gt; cur){
      arr[j+1] = arr[j];
      j--;
    }
    arr[j+1] = cur;

  return arr;

  const mid = arr.length &gt;&gt; 1;
  const L = mergeSort(arr.slice(0, mid));
  const R = mergeSort(arr.slice(mid));
  return merge(L, R);
}

function merge(L, R){
  const out = [];
  let i=0, j=0;
  while (i &lt; L.length &amp;&amp; j &lt; R.length){
    if (L[i] &lt;= R[j]) out.push(L[i++]);
    else out.push(R[j++]);
  }
  return out.concat(L.slice(i)).concat(R.slice(j));
}</code></pre>
<p>Classic divide-and-conquer. Stable. Guaranteed O(n log n). Good for linked lists.</p>

<h2>Quick Sort</h2>
<pre><code>function quickSort(arr, lo=0, hi=arr.length-1){
  if (lo &gt;= hi) return arr;
  const p = partition(arr, lo, hi);
  quickSort(arr, lo, p-1);
  quickSort(arr, p+1, hi);
  return arr;
}

function partition(arr, lo, hi){
  const pivot = arr[hi];
  let i = lo;
  for (let j=lo; j&lt;hi; j++){
    if (arr[j] &lt; pivot){
      [arr[i], arr[j]] = [arr[j], arr[i]];
      i++;
    }
  }
  [arr[i], arr[hi]] = [arr[hi], arr[i]];
  return i;
}</code></pre>
<p>In-place, very fast in practice. Worst case O(n²) when pivot is always min/max — use randomized or median-of-three pivot to avoid.</p>

<h2>Q&amp;A</h2>
<details class="qa"><summary>Which sort does JavaScript use?</summary>
<div class="qa-body"><p>V8 uses <strong>Timsort</strong> (hybrid of merge + insertion). Stable, O(n log n) worst case. Used by Python and Java for objects too.</p></div></details>

<details class="qa"><summary>When would you use insertion sort over merge sort?</summary>
<div class="qa-body"><p>For very small arrays (n &lt; ~20), nearly-sorted arrays, or online (streaming) sorting. Insertion sort has lower constant factors.</p></div></details>

<details class="qa"><summary>Why is merge sort O(n log n) guaranteed?</summary>
<div class="qa-body"><p>log n levels of recursion (halving each time), each level does O(n) work to merge. Doesn't depend on input ordering.</p></div></details>

<details class="qa"><summary>What's a stable sort and why does it matter?</summary>
<div class="qa-body"><p>Equal elements keep their relative order. Matters when sorting by multiple criteria — e.g., sort by name (stable), then by department: items in the same department stay name-sorted.</p></div></details>

<details class="qa"><summary>How do non-comparison sorts beat O(n log n)?</summary>
<div class="qa-body"><p>Counting / radix / bucket sort exploit the structure of the data (integer range, fixed length). They're O(n + k) but only work when k is small relative to n.</p></div></details>
`;

<h1>Recursion &amp; Dynamic Programming</h1>
<p class="lead">Recursion = a function that calls itself. DP = recursion + memoization to avoid recomputing.</p>

<h2>Anatomy of a recursive function</h2>
<ul>
  <li><strong>Base case</strong> — when to stop (otherwise infinite recursion)</li>
  <li><strong>Recursive case</strong> — reduce the problem and call self on smaller input</li>
</ul>

<h2>Examples</h2>

<h3>Factorial</h3>
<pre><code>function fact(n){
  if (n &lt;= 1) return 1;       // base
  return n * fact(n - 1);     // recursive
}</code></pre>

<h3>Fibonacci (naive — O(2ⁿ))</h3>
<pre><code>function fib(n){
  if (n &lt; 2) return n;
  return fib(n-1) + fib(n-2);
}</code></pre>
<p>For n=50, this takes years. Why? It recomputes the same values over and over.</p>

<h3>Fibonacci (memoized — O(n))</h3>
<pre><code>function fib(n, memo = {}){
  if (n &lt; 2) return n;
  if (memo[n] !== undefined) return memo[n];
  return memo[n] = fib(n-1, memo) + fib(n-2, memo);
}</code></pre>

<h3>Fibonacci (bottom-up DP — O(n) time, O(1) space)</h3>
<pre><code>function fib(n){
  if (n &lt; 2) return n;
  let a=0, b=1;
  for (let i=2; i&lt;=n; i++){
    [a, b] = [b, a + b];
  }
  return b;
}</code></pre>

<h2>When to use recursion</h2>
<ul>
  <li>Tree / graph traversal</li>
  <li>Divide and conquer (merge sort, quick sort)</li>
  <li>Backtracking (permutations, N-queens, Sudoku)</li>
  <li>Problems with naturally recursive structure</li>
</ul>

<h2>When to memoize → DP</h2>
<p>If you find yourself solving the same subproblem multiple times, memoize. If the call tree has overlapping subproblems AND optimal substructure, it's a DP problem.</p>

<h2>DP example: climbing stairs</h2>
<p>You can take 1 or 2 steps. How many ways to climb n stairs?</p>
<pre><code>function climbStairs(n){
  if (n &lt;= 2) return n;
  let a=1, b=2;
  for (let i=3; i&lt;=n; i++) [a, b] = [b, a + b];
  return b;
}</code></pre>
<p>It's just Fibonacci.</p>

<h2>DP example: coin change (min coins)</h2>
<pre><code>function coinChange(coins, amount){
  const dp = new Array(amount + 1).fill(Infinity);
  dp[0] = 0;
  for (let a=1; a&lt;=amount; a++){
    for (const c of coins){
      if (c &lt;= a &amp;&amp; dp[a-c] + 1 &lt; dp[a]) dp[a] = dp[a-c] + 1;
    }
  }
  return dp[amount] === Infinity ? -1 : dp[amount];
}</code></pre>

<h2>Backtracking example: subsets</h2>
<pre><code>function subsets(nums){
  const out = [];
  function backtrack(i, cur){
    if (i === nums.length){ out.push([...cur]); return; }
    backtrack(i + 1, cur);            // exclude nums[i]
    cur.push(nums[i]);
    backtrack(i + 1, cur);            // include nums[i]
    cur.pop();
  }
  backtrack(0, []);
  return out;
}</code></pre>

<div class="runner">

function naive(n){ return n &lt; 2 ? n : naive(n-1) + naive(n-2); }
function memoized(n, m={}){ if (n&lt;2) return n; if (m[n]!==undefined) return m[n]; return m[n] = memoized(n-1,m)+memoized(n-2,m); }
function iterative(n){ let a=0,b=1; for(let i=2;i&lt;=n;i++) [a,b]=[b,a+b]; return b; }

const n = 30;
console.time("naive");    console.log("naive   :", naive(n));    console.timeEnd("naive");
console.time("memoized"); console.log("memoized:", memoized(n)); console.timeEnd("memoized");
console.time("iterative");console.log("iter    :", iterative(n));console.timeEnd("iterative");</textarea>
  <div class="rbar"><span style="color:var(--muted);font-size:12px">JavaScript</span><button onclick="runCode('run-dp','out-dp')">▶ Run</button></div>
  <div class="out" id="out-dp">// output appears here</div>
</div>

<h2>Q&amp;A</h2>
<details class="qa"><summary>What's a stack overflow? How do you fix one?</summary>
<div class="qa-body"><p>When recursion depth exceeds the call stack limit. Fixes: ensure a correct base case, convert to iteration, use tail recursion (in languages that optimize it), increase stack size, or use explicit stack data structure.</p></div></details>

<details class="qa"><summary>Recursion vs iteration — which is better?</summary>
<div class="qa-body"><p>Iteration is usually faster (no call overhead) and safer (no stack overflow). Recursion is cleaner for tree/graph traversal and naturally recursive problems. Most languages don't optimize tail calls, so iteration wins on raw performance.</p></div></details>

<details class="qa"><summary>What's the difference between top-down and bottom-up DP?</summary>
<div class="qa-body"><p><strong>Top-down (memoization)</strong>: start from the problem, recurse to subproblems, cache results. <strong>Bottom-up (tabulation)</strong>: start from base cases, build up to the answer iteratively. Bottom-up is usually faster and uses less stack.</p></div></details>

<details class="qa"><summary>How do you recognize a DP problem?</summary>
<div class="qa-body"><p>Look for: (1) overlapping subproblems — same input solved multiple times. (2) optimal substructure — solution can be built from optimal solutions of subproblems. (3) keywords: "count ways", "minimum/maximum", "longest", "shortest".</p></div></details>

<p class="lead">Five principles for writing maintainable, extensible OOP code. Coined by Robert C. Martin (Uncle Bob).</p>

<div class="qa-body"><p>Tight: classes know each other's internals or specific types. Loose: classes interact through abstractions/interfaces. Loose coupling = easier to test, swap, and maintain.</p></div></details>

<h1>Design Patterns</h1>
<p class="lead">Reusable solutions to common design problems. Categorized as Creational, Structural, and Behavioral. You don't need to memorize all 23 — focus on the common ones.</p>

<h2>Creational Patterns</h2>

<h3>Singleton</h3>
<p>Ensures only one instance of a class exists.</p>
<pre><code>class Logger {
  static instance = null;
  static getInstance(){
    if (!Logger.instance) Logger.instance = new Logger();
    return Logger.instance;
  }
  log(msg){ console.log(<span class="s">\`[LOG] \${msg}\`</span>); }
}
Logger.getInstance().log(<span class="s">"hi"</span>);</code></pre>
<p><strong>Use for:</strong> config, logger, DB connection. <strong>Watch out:</strong> hard to test, hidden global state.</p>

<h3>Factory Method</h3>
<p>Creates objects without exposing instantiation logic.</p>
<pre><code>class ShapeFactory {
  static create(type){
    switch(type){
      case <span class="s">"circle"</span>: return new Circle();
      case <span class="s">"square"</span>: return new Square();
      default: throw new Error(<span class="s">"unknown"</span>);
    }
  }
}
const s = ShapeFactory.create(<span class="s">"circle"</span>);</code></pre>

<h3>Builder</h3>
<p>Constructs complex objects step by step.</p>
<pre><code>class QueryBuilder {
  constructor(){ this.parts = {}; }
  select(f){ this.parts.select = f; return this; }
  from(t){ this.parts.from = t; return this; }
  where(c){ this.parts.where = c; return this; }
  build(){ return <span class="s">\`SELECT \${this.parts.select} FROM \${this.parts.from} WHERE \${this.parts.where}\`</span>; }
}

new QueryBuilder().select(<span class="s">"*"</span>).from(<span class="s">"users"</span>).where(<span class="s">"id=1"</span>).build();</code></pre>

<h2>Structural Patterns</h2>

<h3>Adapter</h3>
<p>Lets incompatible interfaces work together.</p>
<pre><code>class OldPrinter { printOld(text){ console.log(text); } }

<span class="c">// new code expects printer.print()</span>
class PrinterAdapter {
  constructor(old){ this.old = old; }
  print(text){ this.old.printOld(text); }
}</code></pre>

<h3>Decorator</h3>
<p>Adds behavior to objects dynamically without altering their class.</p>
<pre><code>function withLogging(fn){
  return function(...args){
    console.log(<span class="s">"calling"</span>, fn.name, args);
    const r = fn(...args);
    console.log(<span class="s">"returned"</span>, r);
    return r;
  };
}

const add = (a, b) =&gt; a + b;
const loggedAdd = withLogging(add);
loggedAdd(<span class="n">2</span>, <span class="n">3</span>);</code></pre>

<h3>Facade</h3>
<p>Provides a simple interface to a complex subsystem.</p>
<pre><code>class HomeTheater {
  constructor(){ this.tv=...; this.amp=...; this.lights=...; this.bluray=...; }
  watchMovie(movie){
    this.lights.dim();
    this.amp.on();
    this.amp.setVolume(<span class="n">11</span>);
    this.tv.on();
    this.bluray.play(movie);
  }
}</code></pre>

<h2>Behavioral Patterns</h2>

<h3>Observer (Pub/Sub)</h3>
<p>Notifies multiple objects when something changes.</p>
<pre><code>class EventBus {
  constructor(){ this.listeners = {}; }
  on(event, fn){ (this.listeners[event] ||= []).push(fn); }
  emit(event, data){ (this.listeners[event] || []).forEach(fn =&gt; fn(data)); }
}

const bus = new EventBus();
bus.on(<span class="s">"user-signup"</span>, u =&gt; console.log(<span class="s">"welcome"</span>, u));
bus.on(<span class="s">"user-signup"</span>, u =&gt; sendEmail(u));
bus.emit(<span class="s">"user-signup"</span>, { name: <span class="s">"Lahiru"</span> });</code></pre>

<h3>Strategy</h3>
<p>Encapsulates interchangeable algorithms.</p>
<pre><code>class Sorter {
  constructor(strategy){ this.strategy = strategy; }
  sort(arr){ return this.strategy(arr); }
}

const quick = arr =&gt; [...arr].sort((a,b) =&gt; a - b);
const reverse = arr =&gt; [...arr].sort((a,b) =&gt; b - a);

new Sorter(quick).sort([<span class="n">3</span>,<span class="n">1</span>,<span class="n">2</span>]);
new Sorter(reverse).sort([<span class="n">3</span>,<span class="n">1</span>,<span class="n">2</span>]);</code></pre>

<h3>Iterator</h3>
<p>Sequentially access elements of a collection without exposing its structure. Built into JS (<code>Symbol.iterator</code>), Java (<code>Iterable</code>), Python (<code>__iter__</code>).</p>

<h3>Command</h3>
<p>Encapsulates a request as an object — enables undo/redo, queueing.</p>
<pre><code>class AddCommand {
  constructor(receiver, value){ this.r = receiver; this.v = value; }
  execute(){ this.r.add(this.v); }
  undo(){ this.r.subtract(this.v); }
}</code></pre>

<h2>Quick Quiz</h2>
<div class="quiz" data-correct="1">
  <strong>Q: Which pattern would you use for a notification system where many parts of the app react to a state change?</strong>
  <div class="opts">
    <div class="opt">Singleton</div>
    <div class="opt">Observer</div>
    <div class="opt">Adapter</div>
    <div class="opt">Builder</div>
  </div>
  <div class="expl">Observer (Pub/Sub) — one subject notifies many observers when its state changes.</div>
</div>

<div class="quiz" data-correct="2">
  <strong>Q: You want one and only one database connection across your app. Which pattern?</strong>
  <div class="opts">
    <div class="opt">Factory</div>
    <div class="opt">Builder</div>
    <div class="opt">Singleton</div>
    <div class="opt">Strategy</div>
  </div>
  <div class="expl">Singleton — ensures a class has only one instance and provides global access to it.</div>
</div>

<h2>Q&amp;A</h2>
<details class="qa"><summary>What's the difference between Factory and Builder?</summary>
<div class="qa-body"><p><strong>Factory</strong>: creates a single complete object based on type. <strong>Builder</strong>: constructs a complex object step-by-step, often with many optional parts.</p></div></details>

<details class="qa"><summary>Why are Singletons criticized?</summary>
<div class="qa-body"><p>They're global state in disguise. They make unit testing hard (can't easily mock or reset), hide dependencies, and create tight coupling.</p></div></details>

<details class="qa"><summary>Decorator vs Adapter?</summary>
<div class="qa-body"><p>Adapter changes one interface into another. Decorator keeps the same interface but adds behavior.</p></div></details>

<details class="qa"><summary>What's the most overused pattern?</summary>
<div class="qa-body"><p>Singleton — often used when a plain module or DI would be cleaner. "Just use a singleton" is often code smell for "I don't want to think about lifecycle."</p></div></details>
`;

<h1>Database &amp; SQL</h1>
<p class="lead">Almost every backend role asks SQL basics. Joins, normalization, indexes, transactions — these come up in every entry-level interview.</p>

<h2>Relational vs NoSQL</h2>
<table>
<tr><th></th><th>Relational (SQL)</th><th>NoSQL</th></tr>
<tr><td>Schema</td><td>Rigid, predefined</td><td>Flexible</td></tr>
<tr><td>Examples</td><td>PostgreSQL, MySQL, Oracle</td><td>MongoDB, Redis, Cassandra, DynamoDB</td></tr>
<tr><td>Joins</td><td>First-class</td><td>Limited / app-side</td></tr>
<tr><td>Transactions</td><td>ACID</td><td>Often BASE / eventually consistent</td></tr>
<tr><td>Scaling</td><td>Vertical mostly</td><td>Horizontal native</td></tr>
</table>

<h2>SQL fundamentals</h2>

<h3>Basic queries</h3>
<pre><code><span class="k">SELECT</span> name, email
<span class="k">FROM</span> users
<span class="k">WHERE</span> active = <span class="k">true</span> <span class="k">AND</span> age &gt; <span class="n">18</span>
<span class="k">ORDER BY</span> created_at <span class="k">DESC</span>
<span class="k">LIMIT</span> <span class="n">10</span>;</code></pre>

<h3>Aggregate functions</h3>
<pre><code><span class="k">SELECT</span> department, <span class="f">COUNT</span>(*) <span class="k">AS</span> headcount, <span class="f">AVG</span>(salary) <span class="k">AS</span> avg_salary
<span class="k">FROM</span> employees
<span class="k">GROUP BY</span> department
<span class="k">HAVING</span> <span class="f">COUNT</span>(*) &gt; <span class="n">5</span>;</code></pre>
<p><strong>WHERE</strong> filters rows before aggregation. <strong>HAVING</strong> filters groups after.</p>

<h2>Joins</h2>
<div class="card">
<table>
<tr><th>Join</th><th>Returns</th></tr>
<tr><td>INNER JOIN</td><td>Rows where both sides match</td></tr>
<tr><td>LEFT JOIN</td><td>All left rows + matching right (NULL if none)</td></tr>
<tr><td>RIGHT JOIN</td><td>All right rows + matching left</td></tr>
<tr><td>FULL OUTER JOIN</td><td>All rows from both sides</td></tr>
<tr><td>CROSS JOIN</td><td>Cartesian product</td></tr>
</table>
</div>
<pre><code><span class="k">SELECT</span> u.name, o.total
<span class="k">FROM</span> users u
<span class="k">LEFT JOIN</span> orders o <span class="k">ON</span> o.user_id = u.id
<span class="k">WHERE</span> o.total &gt; <span class="n">100</span> <span class="k">OR</span> o.id <span class="k">IS NULL</span>;</code></pre>

<h2>Indexes</h2>
<p>Speed up reads on specific columns by maintaining a sorted structure (usually B-tree).</p>
<pre><code><span class="k">CREATE INDEX</span> idx_users_email <span class="k">ON</span> users(email);

<span class="c">-- composite — order matters</span>
<span class="k">CREATE INDEX</span> idx_users_active_email <span class="k">ON</span> users(active, email);</code></pre>
<ul>
  <li><strong>Pro:</strong> O(log n) lookups vs O(n) scans</li>
  <li><strong>Con:</strong> slows writes, uses disk space</li>
  <li><strong>Rule:</strong> index columns in WHERE, JOIN, ORDER BY</li>
</ul>

<h2>Normalization (1NF, 2NF, 3NF)</h2>
<ul>
  <li><strong>1NF</strong> — atomic values, no repeating groups</li>
  <li><strong>2NF</strong> — 1NF + no partial dependencies on composite keys</li>
  <li><strong>3NF</strong> — 2NF + no transitive dependencies</li>
</ul>
<p>Denormalization (storing redundant data) trades disk space for read speed — common in read-heavy systems.</p>

<h2>Transactions &amp; ACID</h2>
<ul>
  <li><strong>Atomicity</strong> — all or nothing</li>
  <li><strong>Consistency</strong> — DB moves from one valid state to another</li>
  <li><strong>Isolation</strong> — concurrent transactions don't see each other's intermediate state</li>
  <li><strong>Durability</strong> — committed changes survive crashes</li>
</ul>
<pre><code><span class="k">BEGIN</span>;
<span class="k">UPDATE</span> accounts <span class="k">SET</span> balance = balance - <span class="n">100</span> <span class="k">WHERE</span> id = <span class="n">1</span>;
<span class="k">UPDATE</span> accounts <span class="k">SET</span> balance = balance + <span class="n">100</span> <span class="k">WHERE</span> id = <span class="n">2</span>;
<span class="k">COMMIT</span>;</code></pre>

<h2>Common interview questions</h2>

<h3>Find the 2nd highest salary</h3>
<pre><code><span class="k">SELECT MAX</span>(salary) <span class="k">FROM</span> employees
<span class="k">WHERE</span> salary &lt; (<span class="k">SELECT MAX</span>(salary) <span class="k">FROM</span> employees);

<span class="c">-- or with window function</span>
<span class="k">SELECT DISTINCT</span> salary <span class="k">FROM</span> (
  <span class="k">SELECT</span> salary, <span class="f">DENSE_RANK</span>() <span class="k">OVER</span> (<span class="k">ORDER BY</span> salary <span class="k">DESC</span>) <span class="k">AS</span> rnk
  <span class="k">FROM</span> employees
) t <span class="k">WHERE</span> rnk = <span class="n">2</span>;</code></pre>

<h3>Find duplicates</h3>
<pre><code><span class="k">SELECT</span> email, <span class="f">COUNT</span>(*) <span class="k">FROM</span> users
<span class="k">GROUP BY</span> email
<span class="k">HAVING</span> <span class="f">COUNT</span>(*) &gt; <span class="n">1</span>;</code></pre>

<h3>Delete duplicates keeping lowest id</h3>
<pre><code><span class="k">DELETE FROM</span> users
<span class="k">WHERE</span> id <span class="k">NOT IN</span> (
  <span class="k">SELECT MIN</span>(id) <span class="k">FROM</span> users <span class="k">GROUP BY</span> email
);</code></pre>

<h2>Q&amp;A</h2>
<details class="qa"><summary>WHERE vs HAVING?</summary>
<div class="qa-body"><p>WHERE filters rows before grouping. HAVING filters groups after aggregation. You can't use aggregates in WHERE.</p></div></details>

<details class="qa"><summary>What's a primary key vs foreign key vs unique key?</summary>
<div class="qa-body"><p><strong>Primary</strong>: uniquely identifies a row, can't be NULL, one per table. <strong>Foreign</strong>: references a PK in another table — enforces referential integrity. <strong>Unique</strong>: enforces uniqueness, allows NULLs, can have multiple per table.</p></div></details>

<details class="qa"><summary>DELETE vs TRUNCATE vs DROP?</summary>
<div class="qa-body"><p><strong>DELETE</strong>: removes rows, can be filtered, logged, rolled back. <strong>TRUNCATE</strong>: removes all rows fast, can't be filtered, often can't be rolled back. <strong>DROP</strong>: removes the table entirely.</p></div></details>

<details class="qa"><summary>What's an N+1 query problem?</summary>
<div class="qa-body"><p>Fetching a list (1 query) then making 1 query per item to load related data → N+1 total queries. Fix with eager loading / JOIN / IN-query.</p></div></details>

<details class="qa"><summary>Why use stored procedures?</summary>
<div class="qa-body"><p>Encapsulate logic in the DB, reduce network round-trips, control access (grant exec only). Downsides: hard to version-control and test compared to app code.</p></div></details>

<details class="qa"><summary>What is CAP theorem?</summary>
<div class="qa-body"><p>A distributed system can have at most 2 of: <strong>Consistency</strong> (all nodes see same data), <strong>Availability</strong> (every request gets a response), <strong>Partition tolerance</strong> (works despite network splits). In practice you pick CP or AP since network partitions are inevitable.</p></div></details>
`;

<h1>System Design Basics</h1>
<p class="lead">Entry-level interviews don't expect a senior engineer's depth — but knowing vocabulary and basic tradeoffs makes a huge impression.</p>

<h2>Core building blocks</h2>

<h3>Client → Load Balancer → Servers → Database</h3>
<pre><code>             ┌──────────┐

<h2>Vertical vs Horizontal scaling</h2>
<ul>
  <li><strong>Vertical (scale up)</strong> — bigger server (more CPU/RAM). Simple but limited.</li>
  <li><strong>Horizontal (scale out)</strong> — more servers. Requires stateless services and a load balancer.</li>
</ul>

<h2>Load balancer</h2>
<p>Distributes traffic across multiple servers. Strategies:</p>
<ul>
  <li><strong>Round robin</strong> — rotate through servers</li>
  <li><strong>Least connections</strong> — pick server with fewest active conns</li>
  <li><strong>IP hash</strong> — consistent server per client</li>
</ul>

<h2>Caching</h2>
<p>Store frequently-accessed data closer to the request to reduce latency and load.</p>
<ul>
  <li><strong>Browser cache</strong> — HTTP headers</li>
  <li><strong>CDN</strong> — geographically distributed static asset cache</li>
  <li><strong>Application cache</strong> — in-memory (Redis, Memcached)</li>
  <li><strong>Database cache</strong> — query result cache</li>
</ul>
<p><strong>Cache invalidation</strong> is famously hard. Strategies: TTL, write-through, write-behind, cache-aside.</p>

<h2>Database scaling</h2>
<ul>
  <li><strong>Read replicas</strong> — copy data to read-only nodes (eventual consistency)</li>
  <li><strong>Sharding</strong> — partition data across machines (by user_id range, by hash, geo)</li>
  <li><strong>Indexing</strong> — speed up reads on hot columns</li>
</ul>

<h2>Message queues</h2>
<p>Decouple producers from consumers (async). Examples: Kafka, RabbitMQ, SQS.</p>
<pre><code>web server  ──[ enqueue ]──▶ queue ──[ dequeue ]──▶ worker

<tr><td>DELETE</td><td>Remove</td><td>Yes</td></tr>
</table>

<h3>Status codes you should know</h3>

  <li><strong>4xx</strong> — Client error (400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 429 Too Many Requests)</li>
  <li><strong>5xx</strong> — Server error (500 Internal Server Error, 502 Bad Gateway, 503 Service Unavailable)</li>
</ul>

<h2>REST vs GraphQL vs gRPC</h2>
<table>
<tr><th></th><th>REST</th><th>GraphQL</th><th>gRPC</th></tr>

<h2>Authentication 101</h2>

<h2>Common tradeoffs to mention</h2>

<details class="qa"><summary>What's the difference between TCP and UDP?</summary>
<div class="qa-body"><p>TCP: connection-oriented, reliable, ordered, slower. Used for HTTP, email, file transfer. UDP: connectionless, fast, no guarantees. Used for video calls, gaming, DNS.</p></div></details>

</div>

<h2>Undoing things</h2>
<pre><code><span class="c"># unstage a file</span>

<details class="qa"><summary>git reset vs git revert?</summary>

<details class="qa"><summary>What's a fast-forward merge?</summary>
<div class="qa-body"><p>When the target branch has no new commits since the source diverged — git just moves the pointer forward. No merge commit needed.</p></div></details>

<details class="qa"><summary>What's a detached HEAD?</summary>

<details class="qa"><summary>What's a Pull Request / Merge Request?</summary>

<h2>CS fundamentals</h2>

<details class="qa"><summary>What is the difference between a process and a thread?</summary>
<div class="qa-body"><p>A <strong>process</strong> is an instance of a program with its own memory space. A <strong>thread</strong> is a lightweight unit of execution inside a process — threads in the same process share memory.</p></div></details>

<details class="qa"><summary>What's a deadlock?</summary>
<div class="qa-body"><p>Two or more threads waiting forever for resources held by each other. Four conditions must hold: mutual exclusion, hold &amp; wait, no preemption, circular wait.</p></div></details>

<details class="qa"><summary>What's a race condition?</summary>
<div class="qa-body"><p>When two threads access shared data concurrently and the outcome depends on timing. Fix with locks, atomics, or immutable data.</p></div></details>

<details class="qa"><summary>Stack vs Heap memory?</summary>
<div class="qa-body"><p><strong>Stack</strong>: function call frames, local variables, fast, LIFO, fixed size. <strong>Heap</strong>: dynamic allocations (objects), slower, managed by GC (Java/JS) or manually (C/C++).</p></div></details>

<details class="qa"><summary>What's garbage collection?</summary>
<div class="qa-body"><p>Automatic memory management — runtime detects unreachable objects and frees them. Common algorithms: mark-and-sweep, generational, reference counting.</p></div></details>

<details class="qa"><summary>What's a memory leak?</summary>
<div class="qa-body"><p>Memory allocated but never freed even though no longer needed. In GC languages: caused by lingering references (forgotten event listeners, caches that grow forever).</p></div></details>

<details class="qa"><summary>Compiled vs Interpreted languages?</summary>
<div class="qa-body"><p>Compiled (C, Rust): source → machine code ahead of time. Fast, harder to iterate. Interpreted (Python, JS): runtime executes source. Slower, faster dev cycle. Many modern langs (Java, C#, JS) use JIT — interpret then compile hot paths.</p></div></details>

<details class="qa"><summary>What is recursion's space cost?</summary>
<div class="qa-body"><p>Each recursive call pushes a stack frame — O(depth) space, even if each frame is constant size. Deep recursion → stack overflow.</p></div></details>

<details class="qa"><summary>Pass by value vs pass by reference?</summary>
<div class="qa-body"><p>By value: function gets a copy. By reference: function gets a pointer/reference to the original. In Java/Python/JS: primitives are by value, objects are "by reference value" (the reference is copied but points to same object).</p></div></details>

<details class="qa"><summary>What's the difference between aggregation and composition?</summary>

<details class="qa"><summary>How would you detect if a string is a palindrome?</summary>
<div class="qa-body"><pre><code>function isPalindrome(s){
  s = s.toLowerCase().replace(/[^a-z0-9]/g, "");
  let i=0, j=s.length-1;
  while (i &lt; j){
    if (s[i] !== s[j]) return false;
    i++; j--;
  }
  return true;
}</code></pre></div></details>

<div class="qa-body"><pre><code>for (let i=1; i&lt;=100; i++){

<details class="qa"><summary>How would you reverse an integer (e.g. 1234 → 4321)?</summary>
<div class="qa-body"><pre><code>function reverseInt(n){

    n = Math.floor(n / 10);

  return r;
}</code></pre></div></details>

<div class="qa-body"><pre><code>function isPrime(n){

  for (let i=2; i*i &lt;= n; i++)

  return true;
}</code></pre></div></details>

<div class="qa-body"><pre><code>// recursive
const fib1 = n =&gt; n &lt; 2 ? n : fib1(n-1) + fib1(n-2);

// memoized
const fib2 = (n, m={}) =&gt; n &lt; 2 ? n : m[n] ??= fib2(n-1,m) + fib2(n-2,m);

// iterative
function fib3(n){
  let a=0, b=1;
  for (let i=2; i&lt;=n; i++) [a,b] = [b, a+b];

<details class="qa"><summary>What does an Operating System do?</summary>

<details class="qa"><summary>What's virtual memory?</summary>
<div class="qa-body"><p>OS gives each process its own virtual address space larger than physical RAM. Mapped to pages of physical memory; least-used pages swapped to disk.</p></div></details>

<details class="qa"><summary>What's a mock?</summary>
<div class="qa-body"><p>A fake object that mimics a real dependency in tests — lets you isolate the unit under test and verify how it interacts with collaborators.</p></div></details>

// ============ ROUTER & UI ============
const TOP_NAV = document.getElementById("topnav");
const MAIN = document.getElementById("main");
const SB = document.getElementById("sidebar-links");

for (const key in PAGES){
  const btn = document.createElement("button");
  btn.textContent = PAGES[key].icon + " " + PAGES[key].title;
  btn.dataset.key = key;
  btn.onclick = () => navigate(key);
  TOP_NAV.appendChild(btn);
}

function navigate(key){
  if (!CONTENT[key]) key = "home";
  location.hash = key;
  MAIN.innerHTML = `<div class="page active">${CONTENT[key]}</div>`;
  document.querySelectorAll("#topnav button, #drawer-nav button.nav").forEach(b => {
    b.classList.toggle("active", b.dataset.key === key);
  });
  buildSidebar();
  attachQuizHandlers();
  attachCopy();
  window.scrollTo({top:0, behavior:"smooth"});
  // Page-specific bootstrapping
  if (key === "arrays") arrReset();
  if (key === "linkedlist") llReset();
  if (key === "stackqueue"){ stkReset(); qReset(); }
  if (key === "trees") bstReset();
  if (key === "sorting") sortGen();
}

function buildSidebar(){
  SB.innerHTML = "";
  const h2s = MAIN.querySelectorAll("h2");
  h2s.forEach((h, i) => {
    const id = "h-" + i;
    h.id = id;
    const a = document.createElement("a");
    a.href = "#" + id;
    a.textContent = h.textContent;
    a.onclick = (e) => {
      e.preventDefault();
      document.getElementById(id).scrollIntoView({behavior:"smooth", block:"start"});
      SB.querySelectorAll("a").forEach(x => x.classList.remove("active"));
      a.classList.add("active");
    };
    SB.appendChild(a);
  });
}

function attachQuizHandlers(){
  document.querySelectorAll(".quiz").forEach(q => {
    const correct = parseInt(q.dataset.correct, 10);
    q.querySelectorAll(".opt").forEach((opt, i) => {
      opt.onclick = () => {
        if (q.classList.contains("answered")) return;
        q.classList.add("answered");
        q.querySelectorAll(".opt").forEach((o, j) => {
          if (j === correct) o.classList.add("correct");
          else if (j === i) o.classList.add("wrong");
        });
      };
    });
  });
}

function attachCopy(){
  document.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".copy")) return;
    const btn = document.createElement("button");
    btn.className = "copy";
    btn.textContent = "Copy";
    btn.onclick = () => {
      navigator.clipboard.writeText(pre.querySelector("code").textContent);
      btn.textContent = "Copied!";
      setTimeout(() => btn.textContent = "Copy", 1500);
    };
    pre.appendChild(btn);
  });
}

function toggleTheme(){
  const cur = document.body.dataset.theme;
  document.body.dataset.theme = cur === "light" ? "" : "light";
}

function showRandomQ(){
  const all = document.querySelectorAll(".qa");
  if (!all.length){
    const keys = Object.keys(PAGES).filter(k => !["home","behavioral"].includes(k));
    navigate(keys[Math.floor(Math.random() * keys.length)]);
    setTimeout(showRandomQ, 100);
    return;
  }
  const q = all[Math.floor(Math.random() * all.length)];
  all.forEach(x => x.removeAttribute("open"));
  q.setAttribute("open", "");
  q.scrollIntoView({behavior:"smooth", block:"center"});
}

function runCode(srcId, outId){
  const src = document.getElementById(srcId).value;
  const out = document.getElementById(outId);
  out.textContent = "";
  const orig = console.log, ot = console.time, oe = console.timeEnd;
  const timers = {};
  console.log = (...args) => {
    out.textContent += args.map(a => typeof a === "object" ? JSON.stringify(a, null, 2) : String(a)).join(" ") + "\n";
  };
  console.time = (l) => { timers[l] = performance.now(); };
  console.timeEnd = (l) => {
    out.textContent += `${l}: ${(performance.now() - timers[l]).toFixed(2)}ms\n`;
  };
  try {
    new Function(src)();
  } catch (e){
    out.textContent += "❌ Error: " + e.message;
  } finally {
    console.log = orig; console.time = ot; console.timeEnd = oe;
  }
}

// ============ BST VIZ ============
let bstRoot = null;
function bstInsertNode(node, v){
  if (!node) return { value: v, left: null, right: null };
  if (v < node.value) node.left = bstInsertNode(node.left, v);
  else if (v > node.value) node.right = bstInsertNode(node.right, v);
  return node;
}
function bstInsert(){
  const v = parseInt(document.getElementById("bst-val").value, 10);
  if (isNaN(v)) return;
  bstRoot = bstInsertNode(bstRoot, v);
  bstDraw();
}
function bstInorder(){
  const out = [];
  (function go(n){ if (!n) return; go(n.left); out.push(n.value); go(n.right); })(bstRoot);
  document.getElementById("bst-trav").textContent = out.join(" → ");
}
function bstReset(){ bstRoot = null; [50, 30, 70, 20, 40, 60, 80, 10, 35].forEach(v => bstRoot = bstInsertNode(bstRoot, v)); bstDraw(); }
function bstDraw(){
  const svg = document.getElementById("bst-svg");
  if (!svg) return;
  svg.innerHTML = "";
  if (!bstRoot) return;
  function getDepth(n){ if (!n) return 0; return 1 + Math.max(getDepth(n.left), getDepth(n.right)); }
  const depth = getDepth(bstRoot);
  const W = 600, levelH = 50;
  function draw(node, x, y, dx){
    if (!node) return;
    if (node.left){
      const lx = x - dx, ly = y + levelH;
      svg.innerHTML += `<line x1="${x}" y1="${y}" x2="${lx}" y2="${ly}" stroke="#7c5cff" stroke-width="1.5"/>`;
      draw(node.left, lx, ly, dx/2);
    }
    if (node.right){
      const rx = x + dx, ry = y + levelH;
      svg.innerHTML += `<line x1="${x}" y1="${y}" x2="${rx}" y2="${ry}" stroke="#7c5cff" stroke-width="1.5"/>`;
      draw(node.right, rx, ry, dx/2);
    }
    svg.innerHTML += `<circle cx="${x}" cy="${y}" r="18" fill="#7c5cff" stroke="#fff" stroke-width="2"/>
                      <text x="${x}" y="${y+5}" text-anchor="middle" fill="white" font-weight="700" font-size="12">${node.value}</text>`;
  }
  draw(bstRoot, W/2, 30, W/4);
}

// ============ SORT VIZ ============
let sortArr = [];
function sortGen(){
  sortArr = Array.from({length: 40}, () => Math.floor(Math.random()*100) + 5);
  sortDraw();
}
function sortDraw(hi=[]){
  const v = document.getElementById("sort-viz");
  if (!v) return;
  v.innerHTML = "";
  const max = Math.max(...sortArr);
  sortArr.forEach((x, i) => {
    const b = document.createElement("div");
    b.style.width = "12px";
    b.style.height = `${(x/max)*150}px`;
    b.style.background = hi.includes(i) ? "var(--accent2)" : "var(--accent)";
    b.style.borderRadius = "2px";
    v.appendChild(b);
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function sortRun(algo){
  if (algo === "bubble"){
    for (let i=0; i<sortArr.length; i++){
      for (let j=0; j<sortArr.length-1-i; j++){
        if (sortArr[j] > sortArr[j+1]){
          [sortArr[j], sortArr[j+1]] = [sortArr[j+1], sortArr[j]];
        }
        sortDraw([j, j+1]);
        await sleep(8);
      }
    }
  } else if (algo === "insertion"){
    for (let i=1; i<sortArr.length; i++){
      const cur = sortArr[i];
      let j = i - 1;
      while (j >= 0 && sortArr[j] > cur){
        sortArr[j+1] = sortArr[j]; j--;
        sortDraw([j+1, i]);
        await sleep(8);
      }
      sortArr[j+1] = cur;
    }
  } else if (algo === "selection"){
    for (let i=0; i<sortArr.length; i++){
      let min = i;
      for (let j=i+1; j<sortArr.length; j++){
        if (sortArr[j] < sortArr[min]) min = j;
        sortDraw([i, j, min]); await sleep(4);
      }
      [sortArr[i], sortArr[min]] = [sortArr[min], sortArr[i]];
    }
  } else if (algo === "quick"){
    async function qs(lo, hi){
      if (lo >= hi) return;
      const pivot = sortArr[hi];
      let i = lo;
      for (let j=lo; j<hi; j++){
        if (sortArr[j] < pivot){
          [sortArr[i], sortArr[j]] = [sortArr[j], sortArr[i]];
          i++;
        }
        sortDraw([i, j, hi]);
        await sleep(8);
      }
      [sortArr[i], sortArr[hi]] = [sortArr[hi], sortArr[i]];
      await qs(lo, i-1);
      await qs(i+1, hi);
    }
    await qs(0, sortArr.length - 1);
  }
  sortDraw();
}
